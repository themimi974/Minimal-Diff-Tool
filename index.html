<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Diff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --transition: 0.18s ease;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    /* light theme tokens (default) */
    --bg:            #f5f5f0;
    --bg-mid:        #eeeee8;
    --bg-surface:    #ffffff;
    --bg-hover:      #e4e4de;
    --border:        #d0d0c8;
    --border-soft:   #e0e0d8;
    --text:          #2a2a2a;
    --text-dim:      #777;
    --text-bright:   #111;
    --accent:        #3060e8;
    --accent-dim:    #d0d8f8;
    --shadow:        0 2px 12px rgba(0,0,0,0.1);

    --add-bg:        #e6f4ea;
    --add-bg-strong: #a9dab8;
    --add-text:      #1e7d32;
    --remove-bg:     #fbeaea;
    --remove-bg-strong: #f0b8b8;
    --remove-text:   #b3261e;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:            #141414;
      --bg-mid:        #1c1c1c;
      --bg-surface:    #242424;
      --bg-hover:      #2e2e2e;
      --border:        #333;
      --border-soft:   #2a2a2a;
      --text:          #d4d4d4;
      --text-dim:      #888;
      --text-bright:   #f0f0f0;
      --accent:        #5b8aff;
      --accent-dim:    #2c3d66;
      --shadow:        0 2px 12px rgba(0,0,0,0.5);

      --add-bg:        #15291c;
      --add-bg-strong: #22572f;
      --add-text:      #4ade80;
      --remove-bg:     #2e1717;
      --remove-bg-strong: #5a2323;
      --remove-text:   #f87171;
    }
  }

  :root[data-theme="dark"] {
    --bg:            #141414;
    --bg-mid:        #1c1c1c;
    --bg-surface:    #242424;
    --bg-hover:      #2e2e2e;
    --border:        #333;
    --border-soft:   #2a2a2a;
    --text:          #d4d4d4;
    --text-dim:      #888;
    --text-bright:   #f0f0f0;
    --accent:        #5b8aff;
    --accent-dim:    #2c3d66;
    --shadow:        0 2px 12px rgba(0,0,0,0.5);

    --add-bg:        #15291c;
    --add-bg-strong: #22572f;
    --add-text:      #4ade80;
    --remove-bg:     #2e1717;
    --remove-bg-strong: #5a2323;
    --remove-text:   #f87171;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    transition: background var(--transition), color var(--transition);
    overflow: hidden;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }

  /* ── Header ── */
  header {
    background: var(--bg-mid);
    border-bottom: 1px solid var(--border);
    padding: env(safe-area-inset-top, 0px) 1rem 0;
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-shrink: 0;
    box-shadow: var(--shadow);
    z-index: 10;
    flex-wrap: wrap;
  }
  header > * { margin: 0.4rem 0; }

  header h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-bright);
    white-space: nowrap;
  }
  header h1 span { color: var(--accent); }

  .header-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

  .btn {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.35rem 0.7rem;
    cursor: pointer;
    border-radius: 4px;
    transition: background var(--transition), border-color var(--transition), color var(--transition);
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--text-bright); }
  .btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:disabled:hover { background: var(--bg-surface); border-color: var(--border); color: var(--text); }

  .diff-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
  }
  .diff-badge .a { color: var(--add-text); }
  .diff-badge .r { color: var(--remove-text); margin-left: 0.4em; }

  .theme-toggle { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }
  .theme-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); }
  .toggle-track {
    width: 38px; height: 20px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    padding: 0;
    transition: background var(--transition), border-color var(--transition);
  }
  :root[data-theme="dark"] .toggle-track { background: var(--accent-dim); border-color: var(--accent); }
  .toggle-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform var(--transition), background var(--transition);
  }
  :root[data-theme="dark"] .toggle-thumb { transform: translateX(18px); background: var(--accent); }

  /* ── Main ── */
  main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  .view { flex: 1; display: flex; overflow: hidden; min-height: 0; }

  /* Coller (input) view */
  #inputView { }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane-label {
    font-size: 11px; letter-spacing: 0.05em;
    color: var(--text-dim);
    padding: 0.6rem 1.25rem 0.4rem;
    display: flex; justify-content: space-between; align-items: baseline;
    flex-shrink: 0;
  }
  .pane-label b { color: var(--text-bright); font-weight: 700; letter-spacing: 0.02em; }
  .pane textarea {
    flex: 1;
    resize: none; border: none; outline: none;
    background: var(--bg); color: var(--text);
    padding: 0 1.25rem 1.25rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height: 1.7;
    tab-size: 2;
  }
  .pane textarea::placeholder { color: var(--text-dim); }
  .pane-divider { width: 1px; background: var(--border); flex-shrink: 0; }

  @media (max-width: 720px) {
    #inputView { flex-direction: column; }
    .pane-divider { width: 100%; height: 1px; }
  }

  /* Diff view */
  #diffView { flex-direction: column; }
  .diff-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.6rem; color: var(--text-dim); text-align: center; padding: 2rem;
  }
  .diff-empty .icon { font-size: 2rem; }
  .diff-empty .msg { font-size: 14px; max-width: 26em; }
  .diff-empty .msg b { color: var(--text-bright); }

  .diff-scroll {
    flex: 1;
    display: flex;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
  }
  .diff-half { flex: 1 1 50%; display: flex; flex-direction: column; min-width: 0; }
  .diff-half + .diff-half { border-left: 1px solid var(--border); }

  .diff-row { display: flex; align-items: stretch; border-left: 3px solid transparent; }
  .diff-row:hover { filter: brightness(0.97); }
  .diff-row.equal   { background: var(--bg-surface); }
  .diff-row.removed, .diff-row.mod-left  { background: var(--remove-bg); border-left-color: var(--remove-text); }
  .diff-row.added,   .diff-row.mod-right { background: var(--add-bg);    border-left-color: var(--add-text); }
  .diff-row.pad     { background: var(--bg-mid); }

  .diff-gutter {
    flex: 0 0 auto; min-width: 2.6rem;
    display: flex; align-items: center; justify-content: flex-end; gap: 0.3rem;
    padding: 0 0.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text-dim);
    user-select: none;
  }
  .diff-gutter .mk { width: 0.9em; text-align: center; font-weight: 700; }
  .diff-gutter .mk.add { color: var(--add-text); }
  .diff-gutter .mk.rem { color: var(--remove-text); }

  .diff-content-wrap { flex: 1; overflow-x: auto; min-width: 0; }
  .diff-content {
    padding: 0.12rem 1.25rem 0.12rem 0.25rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.75;
    white-space: pre;
    display: inline-block;
    min-width: 100%;
  }
  .tok-add { background: var(--add-bg-strong); border-radius: 2px; }
  .tok-rem { background: var(--remove-bg-strong); border-radius: 2px; }

  /* ── Footer ── */
  footer {
    background: var(--bg-mid);
    border-top: 1px solid var(--border);
    padding: 0.5rem 1rem calc(0.5rem + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 0.6rem;
    flex-shrink: 0; flex-wrap: wrap;
  }
  #statLine { font-size: 11.5px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  #statLine .a { color: var(--add-text); }
  #statLine .r { color: var(--remove-text); }
  .footer-right { margin-left: auto; display: flex; align-items: center; gap: 0.4rem; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<header>
  <h1>Code <span>Diff</span></h1>
  <div class="header-divider"></div>
  <button class="btn" id="toggleView" type="button">Diff →</button>
  <span class="diff-badge" id="diffBadge" style="display:none"></span>
  <div class="header-divider"></div>
  <button class="btn" id="swapBtn" type="button" title="Inverser original / modifié">⇄ Inverser</button>
  <button class="btn" id="clearBtn" type="button" title="Tout effacer">✕ Effacer</button>
  <div class="theme-toggle">
    <span class="theme-label" id="themeLabel">Light</span>
    <button class="toggle-track" id="themeToggle" type="button" aria-label="Basculer le thème clair / sombre">
      <span class="toggle-thumb"></span>
    </button>
  </div>
</header>

<main>
  <div id="inputView" class="view">
    <div class="pane">
      <div class="pane-label"><b>Original</b> <span id="countLeft">0 ligne</span></div>
      <textarea id="inputLeft" placeholder="Colle ton code original ici…" spellcheck="false"></textarea>
    </div>
    <div class="pane-divider"></div>
    <div class="pane">
      <div class="pane-label"><b>Modifié</b> <span id="countRight">0 ligne</span></div>
      <textarea id="inputRight" placeholder="Colle la version modifiée ici…" spellcheck="false"></textarea>
    </div>
  </div>

  <div id="diffView" class="view" style="display:none">
    <div class="diff-empty" id="diffEmpty">
      <div class="icon">📋</div>
      <div class="msg" id="diffEmptyMsg">Colle du code des <b>deux côtés</b> pour voir la diff.</div>
    </div>
    <div class="diff-scroll" id="diffScroll" style="display:none">
      <div class="diff-half" id="diffLeft"></div>
      <div class="diff-half" id="diffRight"></div>
    </div>
  </div>
</main>

<footer>
  <span id="statLine">Colle du code des deux côtés pour commencer</span>
  <div class="footer-right">
    <button class="btn" id="copyBtn" type="button">⧉ Copier la diff</button>
  </div>
</footer>

<script>
(function () {
  "use strict";

  /* ---------- diff engine ---------- */

  // Generic LCS-based diff over two arrays (lines or tokens).
  function diffArrays(a, b) {
    var n = a.length, m = b.length;
    if (n * m > 4000000) {
      // pathological case (huge, mostly-different inputs): avoid freezing the tab.
      var ops = [];
      for (var x = 0; x < n; x++) ops.push({ type: 'remove', a: a[x] });
      for (var y = 0; y < m; y++) ops.push({ type: 'add', b: b[y] });
      return ops;
    }
    var dp = new Array(n + 1);
    for (var i = 0; i <= n; i++) dp[i] = new Int32Array(m + 1);
    for (i = n - 1; i >= 0; i--) {
      for (var j = m - 1; j >= 0; j--) {
        if (a[i] === b[j]) dp[i][j] = dp[i + 1][j + 1] + 1;
        else dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var result = [];
    i = 0; var jj = 0;
    while (i < n && jj < m) {
      if (a[i] === b[jj]) { result.push({ type: 'equal', a: a[i], b: b[jj] }); i++; jj++; }
      else if (dp[i + 1][jj] >= dp[i][jj + 1]) { result.push({ type: 'remove', a: a[i] }); i++; }
      else { result.push({ type: 'add', b: b[jj] }); jj++; }
    }
    while (i < n) { result.push({ type: 'remove', a: a[i] }); i++; }
    while (jj < m) { result.push({ type: 'add', b: b[jj] }); jj++; }
    return result;
  }

  // Line-level diff with common prefix/suffix trimming (fast for localized edits).
  function diffLines(a, b) {
    var start = 0;
    var maxStart = Math.min(a.length, b.length);
    while (start < maxStart && a[start] === b[start]) start++;
    var endA = a.length, endB = b.length;
    while (endA > start && endB > start && a[endA - 1] === b[endB - 1]) { endA--; endB--; }
    var prefix = [];
    for (var k = 0; k < start; k++) prefix.push({ type: 'equal', a: a[k], b: b[k] });
    var middle = diffArrays(a.slice(start, endA), b.slice(start, endB));
    var suffix = [];
    for (var s = endA; s < a.length; s++) suffix.push({ type: 'equal', a: a[s], b: b[s - endA + endB] });
    return prefix.concat(middle, suffix);
  }

  // Group raw ops into aligned rows for split rendering.
  function buildRows(ops) {
    var rows = [];
    var i = 0;
    while (i < ops.length) {
      if (ops[i].type === 'equal') {
        rows.push({ type: 'equal', left: ops[i].a, right: ops[i].b });
        i++;
        continue;
      }
      var removes = [], adds = [];
      while (i < ops.length && ops[i].type !== 'equal') {
        if (ops[i].type === 'remove') removes.push(ops[i].a);
        else adds.push(ops[i].b);
        i++;
      }
      var max = Math.max(removes.length, adds.length);
      for (var k = 0; k < max; k++) {
        var l = k < removes.length ? removes[k] : null;
        var r = k < adds.length ? adds[k] : null;
        if (l !== null && r !== null) rows.push({ type: 'modified', left: l, right: r });
        else if (l !== null) rows.push({ type: 'removed', left: l, right: null });
        else rows.push({ type: 'added', left: null, right: r });
      }
    }
    return rows;
  }

  function tokenize(line) {
    return line.match(/(\w+|\s+|[^\w\s])/g) || [];
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function toLines(text) {
    return text === '' ? [] : text.split('\n');
  }

  // Returns {leftHtml, rightHtml} with word-level highlight spans for a modified line pair.
  function tokenDiffHtml(oldLine, newLine) {
    if (oldLine.length > 500 || newLine.length > 500) {
      return {
        left: '<span class="tok-rem">' + escapeHtml(oldLine) + '</span>',
        right: '<span class="tok-add">' + escapeHtml(newLine) + '</span>'
      };
    }
    var ta = tokenize(oldLine), tb = tokenize(newLine);
    var ops = diffArrays(ta, tb);
    var left = '', right = '';
    for (var i = 0; i < ops.length; i++) {
      var op = ops[i];
      if (op.type === 'equal') {
        left += escapeHtml(op.a);
        right += escapeHtml(op.b);
      } else if (op.type === 'remove') {
        left += '<span class="tok-rem">' + escapeHtml(op.a) + '</span>';
      } else {
        right += '<span class="tok-add">' + escapeHtml(op.b) + '</span>';
      }
    }
    return { left: left, right: right };
  }

  /* ---------- DOM / state ---------- */

  var inputLeft = document.getElementById('inputLeft');
  var inputRight = document.getElementById('inputRight');
  var countLeft = document.getElementById('countLeft');
  var countRight = document.getElementById('countRight');

  var inputView = document.getElementById('inputView');
  var diffView = document.getElementById('diffView');
  var diffEmpty = document.getElementById('diffEmpty');
  var diffEmptyMsg = document.getElementById('diffEmptyMsg');
  var diffScroll = document.getElementById('diffScroll');
  var diffLeftEl = document.getElementById('diffLeft');
  var diffRightEl = document.getElementById('diffRight');

  var toggleBtn = document.getElementById('toggleView');
  var diffBadge = document.getElementById('diffBadge');
  var swapBtn = document.getElementById('swapBtn');
  var clearBtn = document.getElementById('clearBtn');
  var copyBtn = document.getElementById('copyBtn');
  var statLine = document.getElementById('statLine');

  var themeToggle = document.getElementById('themeToggle');
  var themeLabel = document.getElementById('themeLabel');

  var showDiff = false;
  var hasAutoRevealed = false;
  var lastRows = null;

  function debounce(fn, ms) {
    var t;
    return function () {
      clearTimeout(t);
      var args = arguments;
      t = setTimeout(function () { fn.apply(null, args); }, ms);
    };
  }

  function pluralLignes(n) { return n + (n === 1 ? ' ligne' : ' lignes'); }

  function computeAndRender() {
    var la = toLines(inputLeft.value);
    var lb = toLines(inputRight.value);
    countLeft.textContent = pluralLignes(la.length);
    countRight.textContent = pluralLignes(lb.length);

    var bothFilled = inputLeft.value.trim() !== '' && inputRight.value.trim() !== '';

    if (!bothFilled) {
      hasAutoRevealed = false;
      lastRows = null;
      diffBadge.style.display = 'none';
      toggleBtn.disabled = false;
      if (inputLeft.value.trim() === '' && inputRight.value.trim() === '') {
        statLine.innerHTML = 'Colle du code des deux côtés pour commencer';
      } else {
        statLine.innerHTML = 'Il manque du code de l\'autre côté';
      }
      renderEmptyDiff();
      return;
    }

    var ops = diffLines(la, lb);
    var rows = buildRows(ops);
    lastRows = rows;

    var added = 0, removed = 0, unchanged = 0;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.type === 'equal') unchanged++;
      else if (r.type === 'added') added++;
      else if (r.type === 'removed') removed++;
      else if (r.type === 'modified') { added++; removed++; }
    }

    if (added === 0 && removed === 0) {
      diffBadge.style.display = 'none';
      statLine.innerHTML = 'Identique — ' + pluralLignes(unchanged);
    } else {
      diffBadge.style.display = '';
      diffBadge.innerHTML = '<span class="a">+' + added + '</span><span class="r">−' + removed + '</span>';
      statLine.innerHTML =
        '<span class="a">+' + added + ' ajout' + (added === 1 ? '' : 's') + '</span> · ' +
        '<span class="r">−' + removed + ' suppression' + (removed === 1 ? '' : 's') + '</span> · ' +
        unchanged + ' inchangée' + (unchanged === 1 ? '' : 's');
    }

    renderDiffRows(rows);

    if (!hasAutoRevealed) {
      hasAutoRevealed = true;
      setView(true);
    }
  }

  var debouncedCompute = debounce(computeAndRender, 250);

  function renderEmptyDiff() {
    diffScroll.style.display = 'none';
    diffEmpty.style.display = 'flex';
    if (inputLeft.value.trim() === '' && inputRight.value.trim() === '') {
      diffEmptyMsg.innerHTML = 'Colle du code des <b>deux côtés</b> pour voir la diff.';
    } else {
      diffEmptyMsg.innerHTML = 'Il manque du code de <b>l\'autre côté</b>.';
    }
  }

  function renderDiffRows(rows) {
    if (!rows.length) { renderEmptyDiff(); return; }

    var added = 0, removed = 0;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].type === 'added' || rows[i].type === 'modified') added++;
      if (rows[i].type === 'removed' || rows[i].type === 'modified') removed++;
    }
    if (added === 0 && removed === 0) {
      diffScroll.style.display = 'none';
      diffEmpty.style.display = 'flex';
      diffEmptyMsg.innerHTML = '✅ Les deux versions sont <b>identiques</b>.';
      diffEmpty.querySelector('.icon').textContent = '✅';
      return;
    }
    diffEmpty.querySelector('.icon').textContent = '📋';
    diffEmpty.style.display = 'none';
    diffScroll.style.display = 'flex';

    var leftHtml = '', rightHtml = '';
    var lnL = 0, lnR = 0;

    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];

      if (row.type === 'equal') {
        lnL++; lnR++;
        leftHtml += rowHtml('equal', lnL, '', escapeHtml(row.left));
        rightHtml += rowHtml('equal', lnR, '', escapeHtml(row.right));
      } else if (row.type === 'removed') {
        lnL++;
        leftHtml += rowHtml('removed', lnL, 'rem', escapeHtml(row.left));
        rightHtml += rowHtml('pad', '', '', '');
      } else if (row.type === 'added') {
        lnR++;
        leftHtml += rowHtml('pad', '', '', '');
        rightHtml += rowHtml('added', lnR, 'add', escapeHtml(row.right));
      } else if (row.type === 'modified') {
        lnL++; lnR++;
        var td = tokenDiffHtml(row.left, row.right);
        leftHtml += rowHtml('mod-left', lnL, 'rem', td.left);
        rightHtml += rowHtml('mod-right', lnR, 'add', td.right);
      }
    }

    diffLeftEl.innerHTML = leftHtml;
    diffRightEl.innerHTML = rightHtml;
  }

  function rowHtml(cls, lineNo, marker, contentHtml) {
    var mk = marker ? '<span class="mk ' + marker + '">' + (marker === 'add' ? '+' : '−') + '</span>' : '<span class="mk"></span>';
    var ln = lineNo === '' ? '' : lineNo;
    return '<div class="diff-row ' + cls + '">' +
      '<div class="diff-gutter">' + mk + '<span>' + ln + '</span></div>' +
      '<div class="diff-content-wrap"><div class="diff-content">' + (contentHtml || '&nbsp;') + '</div></div>' +
      '</div>';
  }

  function setView(toDiff) {
    showDiff = toDiff;
    inputView.style.display = toDiff ? 'none' : 'flex';
    diffView.style.display = toDiff ? 'flex' : 'none';
    toggleBtn.textContent = toDiff ? '← Coller' : 'Diff →';
    toggleBtn.classList.toggle('active', toDiff);
  }

  toggleBtn.addEventListener('click', function () { setView(!showDiff); });

  swapBtn.addEventListener('click', function () {
    var tmp = inputLeft.value;
    inputLeft.value = inputRight.value;
    inputRight.value = tmp;
    computeAndRender();
  });

  clearBtn.addEventListener('click', function () {
    inputLeft.value = '';
    inputRight.value = '';
    hasAutoRevealed = false;
    setView(false);
    computeAndRender();
    inputLeft.focus();
  });

  copyBtn.addEventListener('click', function () {
    var rows = lastRows;
    var text;
    if (!rows || !rows.length) {
      text = '';
    } else {
      var lines = [];
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        if (r.type === 'equal') lines.push('  ' + r.left);
        else if (r.type === 'removed') lines.push('- ' + r.left);
        else if (r.type === 'added') lines.push('+ ' + r.right);
        else if (r.type === 'modified') { lines.push('- ' + r.left); lines.push('+ ' + r.right); }
      }
      text = lines.join('\n');
    }
    var done = function () {
      var original = copyBtn.textContent;
      copyBtn.textContent = '✓ Copié';
      setTimeout(function () { copyBtn.textContent = original; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  });

  function fallbackCopy(text, done) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch (e) { /* clipboard unavailable — silently ignore */ }
  }

  inputLeft.addEventListener('input', debouncedCompute);
  inputRight.addEventListener('input', debouncedCompute);

  /* ---------- theme ---------- */

  function applyThemeLabel() {
    var attr = document.documentElement.getAttribute('data-theme');
    var isDark = attr === 'dark' || (!attr && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    themeLabel.textContent = isDark ? 'Dark' : 'Light';
  }

  themeToggle.addEventListener('click', function () {
    var html = document.documentElement;
    var attr = html.getAttribute('data-theme');
    var isDark = attr === 'dark' || (!attr && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = isDark ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    try { localStorage.setItem('diff-tool-theme', next); } catch (e) {}
    applyThemeLabel();
  });

  (function initTheme() {
    try {
      var saved = localStorage.getItem('diff-tool-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
    applyThemeLabel();
  })();

  /* ---------- init ---------- */
  computeAndRender();
})();
</script>
</body>
</html>
